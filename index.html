<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Table</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jstree/3.3.15/themes/default/style.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jstree/3.3.15/jstree.min.js"></script>
</head>
<body>
    <div class="sidebar">
        <div class="filter-section">
            <h3>Filter by Year</h3>
            <div class="year-range">
                <div class="year-slider" id="yearSlider">
                    <div class="track"></div>
                    <div class="handle" id="minYearHandle"></div>
                    <div class="handle" id="maxYearHandle"></div>
                </div>
                <div class="year-display">
                    <span id="minYearDisplay">1979</span> - <span id="maxYearDisplay">2023</span>
                </div>
                <div class="year-labels">
                    <span>1979</span>
                    <span>2023</span>
                </div>
            </div>
        </div>
        <div class="filter-section">
            <h3>Filter by Law Class</h3>
            <div id="lawClassTree"></div>
            <div class="selection-controls">
                <a href="#" id="clearLawSelections">Clear all</a> | 
                <a href="#" id="selectAllLaws">Select all</a>
            </div>
        </div>

        <div class="filter-section">
            <h3>Search</h3>
            <input type="text" id="searchInput" placeholder="Search...">
        </div>
    </div>
    <div class="main-content">
        <h1>Interactive Law Table</h1>
        <div class="table-container">
            <table id="dataTable">
                <thead></thead>
                <tbody></tbody>
            </table>
            <div class="pagination">
                <button id="prevPage">Previous</button>
                <span id="pageInfo">Page 1 of 1</span>
                <button id="nextPage">Next</button>
            </div>
        </div>
    </div>
    <script type="module" src="js/main.js"></script>
</body>
</html>
